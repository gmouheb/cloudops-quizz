<title>SOA-C03 Exam Drill</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">

<div id="app"></div>

<script src="questions.js"></script>
<script>
(() => {
  const app = document.getElementById('app');
  const DATA = window.QUIZ;
  if (!DATA) {
    app.innerHTML = '<p class="load-error">The question data did not load. Keep <code>questions.js</code> next to this page, or run <code>python3 build.py</code> to generate it.</p>';
    return;
  }

  const QS = DATA.questions;
  const Q = new Map(QS.map(q => [q.n, q]));
  const MULTI = QS.filter(q => q.answer.length > 1).length;
  const STORE = 'soa-c03-drill-v1';
  const SEC_PER_Q = 120;
  const PASS = 720;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const defaults = () => ({
    screen: 'home',
    settings: { pShuffle: false, eShuffle: false, examCount: QS.length, timed: true },
    practice: null,
    exam: null,
    hist: {},
    filter: 'missed',
    confirm: false,
  });
  let S = defaults();
  let fx = {};      // one-shot effects for the next render
  let armed = null; // which "start over" button is waiting for a second click

  /* ---------- helpers ---------- */
  const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const listKeys = keys => keys.length < 2 ? keys.join('') : keys.slice(0, -1).join(', ') + ' and ' + keys[keys.length - 1];
  const fmtTime = ms => {
    const t = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
  };
  const pctOf = (a, b) => b ? Math.round((a / b) * 100) : 0;
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const validSession = s => s && Array.isArray(s.order) && s.order.length > 0 && s.order.every(n => Q.has(n));

  function load() {
    try { const raw = localStorage.getItem(STORE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { /* storage unavailable: state lives in memory */ }
  }

  /* ---------- practice logic ---------- */
  function startPractice(nums, label) {
    const base = nums && nums.length ? nums.slice() : QS.map(q => q.n);
    S.practice = { order: S.settings.pShuffle ? shuffle(base) : base.sort((a, b) => a - b), pos: 0, rec: {}, label: label || '' };
    S.screen = 'practice';
    armed = null;
    fx.top = true;
    go();
  }
  function prec(n) {
    const P = S.practice;
    return P.rec[n] || (P.rec[n] = { sel: [], out: [], misses: 0, done: null, lastWrong: [] });
  }
  function pStatus(n) {
    const r = S.practice.rec[n];
    if (!r) return 'none';
    if (r.done === 'solved' && r.misses === 0) return 'ok';
    if (r.done || r.misses > 0) return 'alarm';
    return 'none';
  }
  function practiceCur() { const P = S.practice; const n = P.order[P.pos]; return { P, n, q: Q.get(n), r: prec(n) }; }

  function practicePick(key) {
    const { q, r } = practiceCur();
    if (r.done || r.out.includes(key)) return;
    if (q.answer.length === 1) { r.sel = [key]; practiceCheck(); return; }
    if (r.sel.includes(key)) r.sel = r.sel.filter(k => k !== key);
    else if (r.sel.length < q.answer.length) r.sel = [...r.sel, key];
    else fx.hint = true;
    fx.focus = key;
    go();
  }
  function practiceCheck() {
    const { n, q, r } = practiceCur();
    if (r.done || r.sel.length !== q.answer.length) return;
    const wrong = r.sel.filter(k => !q.answer.includes(k));
    if (!wrong.length) {
      r.done = 'solved';
      r.lastWrong = [];
      if (r.misses === 0) S.hist[n] = 'ok';
      fx.reveal = true;
      fx.focus = 'next';
    } else {
      r.misses++;
      r.out = [...r.out, ...wrong];
      r.sel = r.sel.filter(k => q.answer.includes(k));
      r.lastWrong = wrong;
      S.hist[n] = 'alarm';
      fx.shake = wrong;
      fx.focus = wrong[0];
    }
    go();
  }
  function practiceReveal() {
    const { n, q, r } = practiceCur();
    if (r.done) return;
    r.done = 'revealed';
    r.sel = q.answer.slice();
    r.lastWrong = [];
    S.hist[n] = 'alarm';
    fx.reveal = true;
    fx.focus = 'next';
    go();
  }
  function practiceSummary(P) {
    const s = { ok: [], recovered: [], revealed: [], open: [] };
    P.order.forEach(n => {
      const r = P.rec[n];
      if (!r || !r.done) s.open.push(n);
      else if (r.done === 'revealed') s.revealed.push(n);
      else if (r.misses > 0) s.recovered.push(n);
      else s.ok.push(n);
    });
    s.missed = P.order.filter(n => { const r = P.rec[n]; return r && (r.misses > 0 || r.done === 'revealed'); });
    return s;
  }

  /* ---------- exam logic ---------- */
  function startExam() {
    const all = QS.map(q => q.n);
    const count = Math.min(S.settings.examCount, all.length);
    let order = count >= all.length ? all : shuffle(all).slice(0, count);
    order = S.settings.eShuffle ? shuffle(order) : order.sort((a, b) => a - b);
    const now = Date.now();
    S.exam = {
      order, pos: 0, ans: {}, flags: {}, startedAt: now,
      deadline: S.settings.timed ? now + order.length * SEC_PER_Q * 1000 : null,
      submittedAt: null, timeUp: false,
    };
    S.confirm = false;
    S.screen = 'exam';
    armed = null;
    fx.top = true;
    go();
  }
  const examComplete = (E, n) => (E.ans[n] || []).length === Q.get(n).answer.length;
  const examActive = () => S.exam && !S.exam.submittedAt;

  function examPick(key) {
    const E = S.exam, n = E.order[E.pos], q = Q.get(n);
    let a = E.ans[n] || [];
    if (q.answer.length === 1) a = [key];
    else if (a.includes(key)) a = a.filter(k => k !== key);
    else if (a.length < q.answer.length) a = [...a, key];
    else fx.hint = true;
    if (a.length) E.ans[n] = a; else delete E.ans[n];
    fx.focus = key;
    go();
  }
  function examResult(E) {
    const rows = E.order.map((n, i) => {
      const q = Q.get(n), a = E.ans[n] || [];
      const state = !a.length ? 'skipped' : sameSet(a, q.answer) ? 'right' : 'wrong';
      return { i, n, q, a, state, flag: !!E.flags[n] };
    });
    const right = rows.filter(r => r.state === 'right').length;
    const total = rows.length;
    return {
      rows, right, total,
      wrong: rows.filter(r => r.state === 'wrong').length,
      skipped: rows.filter(r => r.state === 'skipped').length,
      scaled: Math.round(100 + 900 * right / total),
    };
  }
  function submitExam(timeUp) {
    const E = S.exam;
    if (!E || E.submittedAt) return;
    E.submittedAt = timeUp ? E.deadline : Date.now();
    E.timeUp = !!timeUp;
    const R = examResult(E);
    R.rows.forEach(r => { if (r.state === 'right') S.hist[r.n] = 'ok'; else if (r.state === 'wrong') S.hist[r.n] = 'alarm'; });
    S.confirm = false;
    S.filter = R.right < R.total ? 'missed' : 'all';
    if (S.screen === 'exam') { S.screen = 'examResults'; fx.top = true; }
    go();
  }

  /* ---------- navigation shared by both modes ---------- */
  function session() { return S.screen === 'practice' ? S.practice : S.screen === 'exam' ? S.exam : null; }
  function moveTo(pos) {
    const sess = session();
    if (!sess) return;
    const p = Math.max(0, Math.min(sess.order.length - 1, pos));
    if (p === sess.pos) return;
    sess.pos = p;
    fx.top = true;
    go();
  }
  function pick(key) { S.screen === 'practice' ? practicePick(key) : examPick(key); }
  function practiceNext() {
    const P = S.practice;
    if (P.pos < P.order.length - 1) moveTo(P.pos + 1);
    else { S.screen = 'practiceReport'; fx.top = true; go(); }
  }

  /* ---------- rendering ---------- */
  function go() { save(); render(); }
  function render() {
    const views = { home: viewHome, practice: viewPractice, practiceReport: viewPracticeReport, exam: viewExam, examResults: viewExamResults };
    app.innerHTML = (views[S.screen] || viewHome)();
    app.querySelectorAll('table').forEach(t => {
      if (t.parentElement.classList.contains('table-wrap')) return;
      const w = document.createElement('div');
      w.className = 'table-wrap';
      t.replaceWith(w);
      w.appendChild(t);
    });
    applyFx();
  }
  function applyFx() {
    const f = fx;
    fx = {};
    if (f.top) window.scrollTo(0, 0);
    if (f.shake) f.shake.forEach(k => app.querySelector(`.opt[data-key="${k}"]`)?.classList.add('shake'));
    if (f.hint) app.querySelector('.pick-hint')?.classList.add('flash');
    if (f.reveal) {
      const ex = app.querySelector('.explain');
      if (ex) {
        ex.classList.add('enter');
        const top = ex.getBoundingClientRect().top;
        if (top > window.innerHeight * 0.7) window.scrollBy({ top: top - 96, behavior: reduced ? 'auto' : 'smooth' });
      }
    }
    if (f.focus === 'next') app.querySelector('[data-act="next"]')?.focus({ preventScroll: true });
    else if (f.focus) {
      const el = app.querySelector(`.opt[data-key="${f.focus}"]`);
      if (el && el.getAttribute('aria-disabled') !== 'true') el.focus({ preventScroll: true });
      else app.querySelector('.opt:not([aria-disabled="true"])')?.focus({ preventScroll: true });
    }
  }

  function header(mid) {
    return `<header class="bar"><div class="wrap bar-in">
      <button class="brand" data-act="home" aria-label="SOA-C03 Exam Drill, back to home"><span class="brand-code">SOA-C03</span><span class="brand-name">Exam Drill</span></button>
      ${mid || ''}
    </div></header>`;
  }

  function optHTML(o, { cls = '', disabled = false, pressed = false, tags = '', interactive = true }) {
    const attrs = interactive
      ? `role="button" tabindex="${disabled ? -1 : 0}" data-act="pick" data-key="${o.key}" aria-pressed="${pressed}" aria-disabled="${disabled}"`
      : `data-key="${o.key}"`;
    return `<div class="opt ${cls}" ${attrs}><span class="opt-key">${o.key}</span><div class="opt-body">${o.html}</div>${tags ? `<div class="opt-tags">${tags}</div>` : ''}</div>`;
  }

  function explainHTML(q, chip, extraClass) {
    return `<section class="explain ${extraClass || ''}" aria-label="Explanation">
      <div class="explain-head">${chip}<h3>Answer: ${q.answer.join(', ')}</h3><span class="topic">${q.topic}</span></div>
      <div class="explain-sec right"><h4>Why it's right</h4><div class="prose">${q.why}</div></div>
      <div class="explain-sec wrong"><h4>Why the other options are wrong</h4><div class="prose">${q.whyNot}</div></div>
    </section>`;
  }

  /* home */
  function viewHome() {
    const P = S.practice, E = S.exam;
    const hist = QS.map(q => S.hist[q.n] || 'none');
    const nOk = hist.filter(h => h === 'ok').length;
    const nAlarm = hist.filter(h => h === 'alarm').length;
    const nNone = QS.length - nOk - nAlarm;

    const pSum = P ? practiceSummary(P) : null;
    const pDone = pSum ? P.order.length - pSum.open.length : 0;
    let practiceActions;
    if (P && pSum.open.length) {
      practiceActions = `<button class="btn primary" data-act="resume-practice">Resume practice · ${pDone}/${P.order.length}</button>
        <button class="btn ${armed === 'practice' ? 'danger' : 'ghost'}" data-act="restart-practice">${armed === 'practice' ? 'Discard progress and restart' : 'Start over'}</button>`;
    } else {
      practiceActions = `<button class="btn primary" data-act="start-practice">Start practice</button>`;
    }
    const practiceSub = P
      ? `<p class="sub">${P.label ? P.label + ': ' : ''}${pDone} of ${P.order.length} answered, ${pSum.ok.length} right on the first try. <button data-act="report">See report</button></p>`
      : '';

    let examActions, examSub = '';
    if (examActive()) {
      const answered = E.order.filter(n => examComplete(E, n)).length;
      const left = E.deadline ? ` · ${fmtTime(E.deadline - Date.now())} left` : '';
      examActions = `<button class="btn primary" data-act="resume-exam">Resume exam · ${answered}/${E.order.length}${left}</button>
        <button class="btn ${armed === 'exam' ? 'danger' : 'ghost'}" data-act="restart-exam">${armed === 'exam' ? 'Discard answers and restart' : 'Start over'}</button>`;
    } else {
      examActions = `<button class="btn primary" data-act="start-exam">Start exam</button>`;
      if (E && E.submittedAt) {
        const R = examResult(E);
        examSub = `<p class="sub">Last exam: ${R.right}/${R.total} correct, estimated ${R.scaled}. <button data-act="results">Review it</button></p>`;
      }
    }
    const countOpts = [QS.length, 30, 15].filter((v, i, a) => v <= QS.length && a.indexOf(v) === i)
      .map(v => `<option value="${v}" ${S.settings.examCount === v ? 'selected' : ''}>${v === QS.length ? `All ${v} (full exam)` : `${v} random`}</option>`).join('');

    return `${header()}
    <main class="wrap">
      <section class="hero">
        <div>
          <p class="eyebrow">AWS Certified CloudOps Engineer – Associate</p>
          <h1><span class="code">SOA-C03</span>Exam Drill</h1>
          <p class="lede">${QS.length} questions from the official AWS Skill Builder practice assessment. Each one explains why the right answer is right and why every other option is wrong.</p>
        </div>
        <dl class="specs">
          <div><dt>Questions</dt><dd>${QS.length}</dd></div>
          <div><dt>Select two</dt><dd>${MULTI}</dd></div>
          <div><dt>Full exam timer</dt><dd>${QS.length * SEC_PER_Q / 60}<small>min</small></dd></div>
          <div><dt>Passing score</dt><dd>${PASS}<small>/ 1000</small></dd></div>
        </dl>
      </section>

      <section class="board" aria-labelledby="board-t">
        <div class="board-head">
          <h2 id="board-t">Question status<span>your latest result on each question</span></h2>
          <div class="counts">
            <span><i class="sw ok"></i>OK <b>${nOk}</b></span>
            <span><i class="sw alarm"></i>ALARM <b>${nAlarm}</b></span>
            <span><i class="sw"></i>INSUFFICIENT_DATA <b>${nNone}</b></span>
          </div>
        </div>
        <div class="strip" role="img" aria-label="${nOk} questions OK, ${nAlarm} in ALARM, ${nNone} not answered yet">
          ${QS.map((q, i) => `<i class="${hist[i] === 'none' ? '' : hist[i]}" title="Q${q.n}: ${hist[i] === 'ok' ? 'OK' : hist[i] === 'alarm' ? 'ALARM' : 'not answered yet'}"></i>`).join('')}
        </div>
        <div class="strip-axis"><span>Q1</span><span>Q${QS.length}</span></div>
        ${nAlarm ? `<div class="row"><button class="btn" data-act="practice-alarm">Practice the ${plural(nAlarm, 'question')} in ALARM</button></div>` : ''}
      </section>

      <section class="modes">
        <article class="mode" aria-labelledby="m-practice">
          <div class="mode-head"><h2 id="m-practice">Practice</h2><span class="mono">Feedback on every pick</span></div>
          <ul class="rules">
            <li>A wrong pick is marked wrong, and you pick again.</li>
            <li>Once you get it right, you see why it's right and why each other option is wrong.</li>
            <li>Stuck? Show the answer and read the explanation.</li>
          </ul>
          <div class="settings">
            <label for="set-pshuffle"><input type="checkbox" id="set-pshuffle" ${S.settings.pShuffle ? 'checked' : ''}> Shuffle question order</label>
          </div>
          ${practiceSub}
          <div class="row">${practiceActions}</div>
        </article>

        <article class="mode" aria-labelledby="m-exam">
          <div class="mode-head"><h2 id="m-exam">Exam</h2><span class="mono">No feedback until you submit</span></div>
          <ul class="rules">
            <li>Answer at your own pace and flag questions to revisit.</li>
            <li>Submit to get your score against the ${PASS} passing mark.</li>
            <li>Then review every question with its full explanation.</li>
          </ul>
          <div class="settings">
            <div class="field"><label for="set-count">Questions</label><select id="set-count">${countOpts}</select></div>
            <label for="set-timed"><input type="checkbox" id="set-timed" ${S.settings.timed ? 'checked' : ''}> Time limit (2 min per question)</label>
            <label for="set-eshuffle"><input type="checkbox" id="set-eshuffle" ${S.settings.eShuffle ? 'checked' : ''}> Shuffle question order</label>
          </div>
          ${examSub}
          <div class="row">${examActions}</div>
        </article>
      </section>

      <p class="source">Questions and explanations come from <code>aws-cloudops-practice-exam-explained.md</code>. The explanations are that file author's reasoning, not AWS's official rationale. Progress is saved in this browser only.</p>
    </main>`;
  }

  /* practice */
  function viewPractice() {
    const { P, n, q, r } = practiceCur();
    const multi = q.answer.length > 1;
    const done = !!r.done;
    const sum = practiceSummary(P);
    const answered = P.order.length - sum.open.length;
    const last = P.pos === P.order.length - 1;

    const opts = q.options.map(o => {
      const k = o.key;
      const right = done && q.answer.includes(k);
      const out = r.out.includes(k);
      const sel = r.sel.includes(k);
      const cls = right ? 'is-right' : out ? 'is-out' : sel ? 'is-sel' : '';
      const tags = right ? '<span class="opt-tag ok">Correct</span>' : out ? '<span class="opt-tag bad">Wrong</span>' : '';
      return optHTML(o, { cls, disabled: done || out, pressed: sel || right, tags });
    }).join('');

    let feedback = '';
    if (!done && r.lastWrong.length) {
      const w = r.lastWrong;
      const msg = multi
        ? `${listKeys(w)} ${w.length > 1 ? 'are' : 'is'} not one of the answers.${r.sel.length ? ' Your other pick is still selected.' : ''} Pick again.`
        : `${w[0]} is not the answer. Pick again.`;
      feedback = `<div class="feedback" role="status"><span class="state alarm">ALARM</span><p>${msg}</p><span class="mono">misses: ${r.misses}</span></div>`;
    }
    const hint = multi && !done ? `<p class="pick-hint" aria-live="polite">${r.sel.length} of ${q.answer.length} selected${r.sel.length === q.answer.length ? ', ready to check' : ''}</p>` : '';

    const chip = r.done === 'revealed' ? '<span class="state">REVEALED</span>'
      : r.misses ? `<span class="state ok">OK</span><span class="mono topic">after ${plural(r.misses, 'miss', 'misses')}</span>`
      : '<span class="state ok">OK</span><span class="mono topic">first try</span>';

    const actions = done
      ? `<button class="btn primary" data-act="next">${last ? 'See practice report' : 'Next question'} <span class="k">Enter</span></button>`
      : `${multi ? `<button class="btn primary" data-act="check" ${r.sel.length === q.answer.length ? '' : 'disabled'}>Check answer <span class="k">Enter</span></button>` : ''}
         <button class="btn ghost" data-act="reveal">Show answer</button>
         ${last ? '' : '<button class="btn ghost" data-act="skip">Skip</button>'}`;

    return `${header(`<div class="bar-mid"><span class="bar-mode">Practice</span>${P.label ? `<span>${P.label}</span>` : ''}<span>${answered}/${P.order.length} answered</span></div>`)}
    <div class="progress" aria-hidden="true"><i style="width:${pctOf(answered, P.order.length)}%"></i></div>
    <main class="wrap quiz">
      <div class="qcol">
        <div class="qmeta">
          <h2 class="qnum">Question ${P.pos + 1} <small>of ${P.order.length}</small></h2>
          ${multi ? `<span class="state flag">SELECT ${q.answer.length}</span>` : ''}
          ${P.order.some((x, i) => x !== i + 1) ? `<span class="mono push">source #${n}</span>` : ''}
        </div>
        <div class="stem">${q.stem}</div>
        <div class="opts" role="group" aria-label="Answer options">${opts}</div>
        ${hint}
        ${feedback}
        <div class="actions">
          <button class="btn" data-act="prev" ${P.pos === 0 ? 'disabled' : ''}>← Previous</button>
          <span class="spacer"></span>
          ${actions}
        </div>
        ${done ? explainHTML(q, chip) : ''}
        <p class="keys"><kbd>A</kbd>–<kbd>${q.options[q.options.length - 1].key}</kbd> pick · <kbd>Enter</kbd> ${multi ? 'check / ' : ''}next · <kbd>←</kbd> <kbd>→</kbd> move</p>
      </div>
      <aside class="rail" aria-label="Question map">
        <div class="rail-head"><h2>Questions</h2><span class="mono">${answered}/${P.order.length}</span></div>
        <ol class="cells">${P.order.map((x, i) => {
          const st = pStatus(x);
          const label = st === 'ok' ? 'right first try' : st === 'alarm' ? 'missed at least once' : 'not answered';
          return `<li><button class="cell ${st === 'none' ? '' : 's-' + st} ${i === P.pos ? 'is-cur' : ''}" data-act="goto" data-pos="${i}" aria-label="Question ${i + 1}, ${label}" ${i === P.pos ? 'aria-current="step"' : ''}>${i + 1}</button></li>`;
        }).join('')}</ol>
        <ul class="legend">
          <li><i class="sw ok"></i><b>OK</b> right on the first try</li>
          <li><i class="sw alarm"></i><b>ALARM</b> missed at least once</li>
          <li><i class="sw"></i><b>INSUFFICIENT_DATA</b> not answered</li>
        </ul>
        <button class="btn wide" data-act="report">End practice and see report</button>
      </aside>
    </main>`;
  }

  function viewPracticeReport() {
    const P = S.practice;
    const s = practiceSummary(P);
    const total = P.order.length;
    const missItems = s.missed.map(n => {
      const r = P.rec[n], q = Q.get(n), i = P.order.indexOf(n);
      const what = r.done === 'revealed' ? 'answer shown' : r.done ? plural(r.misses, 'miss', 'misses') : `${plural(r.misses, 'miss', 'misses')}, unsolved`;
      return `<li><button data-act="goto" data-pos="${i}"><span class="state alarm">ALARM</span><span class="miss-topic">${q.topic}</span><span class="mono">#${n} · ${what}</span></button></li>`;
    }).join('');

    return `${header(`<div class="bar-mid"><span class="bar-mode">Practice report</span></div>`)}
    <main class="wrap">
      <section class="score">
        <div>
          <p class="eyebrow">Practice report${P.label ? ' · ' + P.label : ''}</p>
          <div class="score-main">
            <p class="big">${s.ok.length}<span class="of"> / ${total}</span></p>
            <div class="verdict"><p>right on the first try (${pctOf(s.ok.length, total)}%)</p></div>
          </div>
        </div>
        <dl class="specs four">
          <div><dt>First try</dt><dd>${s.ok.length}</dd></div>
          <div><dt>After a miss</dt><dd>${s.recovered.length}</dd></div>
          <div><dt>Answer shown</dt><dd>${s.revealed.length}</dd></div>
          <div><dt>Not answered</dt><dd>${s.open.length}</dd></div>
        </dl>
        <div class="row">
          ${s.missed.length ? `<button class="btn primary" data-act="practice-missed">Practice the ${plural(s.missed.length, 'missed question')} again</button>` : ''}
          ${s.open.length ? `<button class="btn ${s.missed.length ? '' : 'primary'}" data-act="continue-practice">Continue practice</button>` : ''}
          <button class="btn" data-act="start-practice">New full practice</button>
          <button class="btn ghost" data-act="home">Home</button>
        </div>
      </section>
      <section class="review">
        <div class="review-head"><h2>Questions to review</h2></div>
        ${s.missed.length ? `<ul class="miss-list">${missItems}</ul>` : `<p class="empty">${s.open.length === total ? 'No answers yet.' : 'No misses. Every answered question was right on the first try.'}</p>`}
      </section>
    </main>`;
  }

  /* exam */
  function viewExam() {
    const E = S.exam, n = E.order[E.pos], q = Q.get(n), a = E.ans[n] || [];
    const multi = q.answer.length > 1;
    const answered = E.order.filter(x => examComplete(E, x)).length;
    const last = E.pos === E.order.length - 1;
    const flagged = !!E.flags[n];
    const timerText = E.deadline ? fmtTime(E.deadline - Date.now()) : fmtTime(Date.now() - E.startedAt);
    const low = E.deadline && E.deadline - Date.now() < 5 * 60000;

    const opts = q.options.map(o => optHTML(o, { cls: a.includes(o.key) ? 'is-sel' : '', pressed: a.includes(o.key) })).join('');
    const hint = multi ? `<p class="pick-hint" aria-live="polite">${a.length} of ${q.answer.length} selected</p>` : '';
    const nFlags = E.order.filter(x => E.flags[x]).length;

    let dialog = '';
    if (S.confirm) {
      const open = E.order.length - answered;
      dialog = `<div class="scrim" data-act="cancel-submit"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
        <h2 id="dlg-t">Submit your exam?</h2>
        <p>You answered ${answered} of ${E.order.length} questions.${open ? ` ${plural(open, 'question')} ${open === 1 ? 'is' : 'are'} unanswered or incomplete and will count as wrong.` : ''}${nFlags ? ` ${plural(nFlags, 'question')} ${nFlags === 1 ? 'is' : 'are'} flagged for review.` : ''}</p>
        <p class="note">After you submit, you see your score and then the explanations. Answers can't be changed.</p>
        <div class="row"><button class="btn ghost" data-act="cancel-submit">Keep working</button><button class="btn primary" data-act="submit" id="dlg-submit">Submit exam</button></div>
      </div></div>`;
    }

    return `${header(`<div class="bar-mid"><span class="bar-mode">Exam</span><span>${answered}/${E.order.length} answered</span>
        <span id="timer" class="timer ${low ? 'low' : ''}" title="${E.deadline ? 'Time left' : 'Time elapsed'}">${timerText}</span></div>
        <button class="btn primary sm" data-act="submit-ask">Submit</button>`)}
    <div class="progress" aria-hidden="true"><i style="width:${pctOf(answered, E.order.length)}%"></i></div>
    <main class="wrap quiz">
      <div class="qcol">
        <div class="qmeta">
          <h2 class="qnum">Question ${E.pos + 1} <small>of ${E.order.length}</small></h2>
          ${multi ? `<span class="state flag">SELECT ${q.answer.length}</span>` : ''}
          ${flagged ? '<span class="state flag">FLAGGED</span>' : ''}
        </div>
        <div class="stem">${q.stem}</div>
        <div class="opts" role="group" aria-label="Answer options">${opts}</div>
        ${hint}
        <div class="actions">
          <button class="btn" data-act="prev" ${E.pos === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="btn ghost" data-act="flag" aria-pressed="${flagged}">${flagged ? 'Remove flag' : 'Flag for review'} <span class="k">F</span></button>
          <span class="spacer"></span>
          ${last
            ? '<button class="btn primary" data-act="submit-ask">Review and submit</button>'
            : '<button class="btn primary" data-act="next">Next <span class="k">→</span></button>'}
        </div>
        <p class="keys"><kbd>A</kbd>–<kbd>${q.options[q.options.length - 1].key}</kbd> pick · <kbd>F</kbd> flag · <kbd>←</kbd> <kbd>→</kbd> move</p>
      </div>
      <aside class="rail" aria-label="Question map">
        <div class="rail-head"><h2>Questions</h2><span class="mono">${answered}/${E.order.length}</span></div>
        <ol class="cells">${E.order.map((x, i) => {
          const done = examComplete(E, x);
          const part = !done && (E.ans[x] || []).length > 0;
          const label = (done ? 'answered' : part ? 'incomplete' : 'not answered') + (E.flags[x] ? ', flagged' : '');
          return `<li><button class="cell ${done ? 's-ans' : part ? 's-part' : ''} ${E.flags[x] ? 'is-flag' : ''} ${i === E.pos ? 'is-cur' : ''}" data-act="goto" data-pos="${i}" aria-label="Question ${i + 1}, ${label}" ${i === E.pos ? 'aria-current="step"' : ''}>${i + 1}</button></li>`;
        }).join('')}</ol>
        <ul class="legend">
          <li><i class="sw ans"></i>Answered</li>
          <li><i class="sw"></i>Not answered</li>
          <li><i class="sw flag"></i>Flagged for review (${nFlags})</li>
        </ul>
        <button class="btn primary wide" data-act="submit-ask">Submit exam</button>
      </aside>
    </main>
    ${dialog}`;
  }

  function viewExamResults() {
    const E = S.exam;
    const R = examResult(E);
    const pass = R.scaled >= PASS;
    const used = E.submittedAt - E.startedAt;
    const missed = R.rows.filter(r => r.state !== 'right');
    const flagged = R.rows.filter(r => r.flag);
    const lists = { missed, flagged, all: R.rows };
    const filter = lists[S.filter] ? S.filter : 'all';
    const shown = lists[filter];

    const item = r => {
      const { q, a } = r;
      const chip = r.state === 'right' ? '<span class="state ok">OK</span>' : r.state === 'wrong' ? '<span class="state alarm">ALARM</span>' : '<span class="state">INSUFFICIENT_DATA</span>';
      const opts = q.options.map(o => {
        const isAns = q.answer.includes(o.key), picked = a.includes(o.key);
        const cls = isAns ? 'is-right' : picked ? 'is-out' : '';
        const tags = (isAns ? '<span class="opt-tag ok">Correct</span>' : '') + (picked ? `<span class="opt-tag ${isAns ? 'ok' : 'bad'}">Your pick</span>` : '');
        return optHTML(o, { cls, tags, interactive: false });
      }).join('');
      return `<article class="rev">
        <div class="rev-head">${chip}<h3>Question ${r.i + 1}</h3>${r.flag ? '<span class="state flag">FLAGGED</span>' : ''}<span class="mono">source #${r.n}</span></div>
        <div class="stem">${q.stem}</div>
        <div class="opts static">${opts}</div>
        ${a.length ? '' : '<p class="yours">You did not answer this question.</p>'}
        ${explainHTML(q, '', '')}
      </article>`;
    };
    const tab = (key, label, n) => `<button class="tab" data-act="filter" data-f="${key}" aria-pressed="${filter === key}">${label}<span class="n">${n}</span></button>`;

    return `${header(`<div class="bar-mid"><span class="bar-mode">Exam result</span></div>`)}
    <main class="wrap">
      <section class="score">
        <div>
          <p class="eyebrow">Exam result · ${new Date(E.submittedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</p>
          <div class="score-main">
            <p class="big">${R.right}<span class="of"> / ${R.total}</span></p>
            <div class="verdict">
              <span class="state ${pass ? 'ok' : 'alarm'}">${pass ? 'PASS' : 'BELOW ' + PASS}</span>
              <p>${pctOf(R.right, R.total)}% correct · estimated scaled score <b class="mono">${R.scaled}</b></p>
            </div>
          </div>
          <div class="meter-box" aria-hidden="true">
            <div class="meter">
              <div class="meter-fill ${pass ? '' : 'fail'}" style="width:${(R.scaled - 100) / 9}%"></div>
              <div class="meter-pass" style="left:${(PASS - 100) / 9}%"><span>${PASS} to pass</span></div>
            </div>
            <div class="meter-axis"><span>100</span><span>1000</span></div>
          </div>
        </div>
        <dl class="specs four">
          <div><dt>Correct</dt><dd>${R.right}</dd></div>
          <div><dt>Wrong</dt><dd>${R.wrong}</dd></div>
          <div><dt>Unanswered</dt><dd>${R.skipped}</dd></div>
          <div><dt>Time used</dt><dd>${fmtTime(used)}</dd></div>
        </dl>
        <p class="note">${E.timeUp ? 'Time ran out, so the exam was submitted automatically. ' : ''}Multi-select questions count only when every pick is right. The scaled score is a straight-line estimate from 100 to 1000; AWS uses its own scaling.</p>
        <div class="row">
          ${missed.length ? `<button class="btn primary" data-act="practice-exam-missed">Practice the ${plural(missed.length, 'question')} you missed</button>` : ''}
          <button class="btn" data-act="start-exam">Take another exam</button>
          <button class="btn ghost" data-act="home">Home</button>
        </div>
      </section>
      <section class="review">
        <div class="review-head">
          <h2>Explanations</h2>
          <div class="tabs">${tab('missed', 'Missed', missed.length)}${tab('flagged', 'Flagged', flagged.length)}${tab('all', 'All', R.total)}</div>
        </div>
        ${shown.length ? shown.map(item).join('') : `<p class="empty">${filter === 'missed' ? 'Nothing missed. Every question was answered correctly.' : 'No questions were flagged.'}</p>`}
      </section>
    </main>`;
  }

  /* ---------- events ---------- */
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
    const act = t.dataset.act;
    if (act !== 'restart-practice' && act !== 'restart-exam') armed = null;
    switch (act) {
      case 'home': S.confirm = false; S.screen = 'home'; fx.top = true; go(); break;
      case 'start-practice': startPractice(); break;
      case 'resume-practice': S.screen = 'practice'; fx.top = true; go(); break;
      case 'continue-practice': {
        const P = S.practice;
        const i = P.order.findIndex(n => !(P.rec[n] && P.rec[n].done));
        P.pos = i < 0 ? P.pos : i;
        S.screen = 'practice'; fx.top = true; go();
        break;
      }
      case 'restart-practice':
        if (armed === 'practice') startPractice();
        else { armed = 'practice'; render(); }
        break;
      case 'practice-missed': startPractice(practiceSummary(S.practice).missed, 'Missed questions'); break;
      case 'practice-alarm': startPractice(QS.filter(q => S.hist[q.n] === 'alarm').map(q => q.n), 'Questions in ALARM'); break;
      case 'practice-exam-missed': startPractice(examResult(S.exam).rows.filter(r => r.state !== 'right').map(r => r.n), 'Missed in exam'); break;
      case 'report': S.screen = 'practiceReport'; fx.top = true; go(); break;
      case 'start-exam': startExam(); break;
      case 'resume-exam': S.screen = 'exam'; fx.top = true; go(); break;
      case 'restart-exam':
        if (armed === 'exam') startExam();
        else { armed = 'exam'; render(); }
        break;
      case 'results': S.screen = 'examResults'; fx.top = true; go(); break;
      case 'pick': pick(t.dataset.key); break;
      case 'check': practiceCheck(); break;
      case 'reveal': practiceReveal(); break;
      case 'skip': moveTo(S.practice.pos + 1); break;
      case 'prev': moveTo(session().pos - 1); break;
      case 'next': S.screen === 'practice' ? practiceNext() : moveTo(S.exam.pos + 1); break;
      case 'goto': {
        if (S.screen === 'practiceReport') S.screen = 'practice';
        const sess = session();
        sess.pos = +t.dataset.pos; fx.top = true; go();
        break;
      }
      case 'flag': toggleFlag(); break;
      case 'submit-ask': S.confirm = true; render(); app.querySelector('#dlg-submit')?.focus(); break;
      case 'cancel-submit':
        if (t.classList.contains('scrim') && e.target !== t) return; // clicks inside the dialog
        S.confirm = false; render();
        break;
      case 'submit': submitExam(false); break;
      case 'filter': S.filter = t.dataset.f; go(); break;
    }
  });

  app.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'set-pshuffle') S.settings.pShuffle = e.target.checked;
    else if (id === 'set-eshuffle') S.settings.eShuffle = e.target.checked;
    else if (id === 'set-timed') S.settings.timed = e.target.checked;
    else if (id === 'set-count') S.settings.examCount = +e.target.value;
    else return;
    save();
  });

  app.addEventListener('keydown', e => {
    const opt = e.target.closest && e.target.closest('.opt[data-act="pick"]');
    if (opt && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      if (opt.getAttribute('aria-disabled') !== 'true') pick(opt.dataset.key);
    }
  });

  function toggleFlag() {
    const E = S.exam, n = E.order[E.pos];
    if (E.flags[n]) delete E.flags[n]; else E.flags[n] = true;
    go();
  }

  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (S.confirm) {
      if (e.key === 'Escape') { S.confirm = false; render(); }
      return;
    }
    if (S.screen !== 'practice' && S.screen !== 'exam') return;
    const sess = session();
    const q = Q.get(sess.order[sess.pos]);
    const k = e.key.toLowerCase();
    let key = null;
    if (/^[a-e]$/.test(k)) key = k.toUpperCase();
    else if (/^[1-5]$/.test(k)) key = 'ABCDE'[+k - 1];
    if (key) {
      if (q.options.some(o => o.key === key)) { e.preventDefault(); pick(key); }
      return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (S.screen === 'exam') moveTo(sess.pos + 1); else if (sess.pos < sess.order.length - 1) moveTo(sess.pos + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveTo(sess.pos - 1); }
    else if (k === 'f' && S.screen === 'exam') { e.preventDefault(); toggleFlag(); }
    else if (e.key === 'Enter' && S.screen === 'practice') {
      if (e.target.closest && e.target.closest('button, .opt')) return;
      const r = prec(sess.order[sess.pos]);
      if (r.done) { e.preventDefault(); practiceNext(); }
      else if (q.answer.length > 1 && r.sel.length === q.answer.length) { e.preventDefault(); practiceCheck(); }
    }
  });

  /* exam clock */
  function tick() {
    const E = S.exam;
    if (!E || E.submittedAt) return;
    if (E.deadline && Date.now() >= E.deadline) {
      submitExam(true);
      return;
    }
    const el = document.getElementById('timer');
    if (el) {
      if (E.deadline) {
        const left = E.deadline - Date.now();
        el.textContent = fmtTime(left);
        el.classList.toggle('low', left < 5 * 60000);
      } else {
        el.textContent = fmtTime(Date.now() - E.startedAt);
      }
    }
  }
  setInterval(tick, 1000);

  /* ---------- boot ---------- */
  function boot(data) {
    const saved = (data && data.state) || load();
    if (saved && typeof saved === 'object') {
      const d = defaults();
      S = Object.assign(d, saved, { settings: Object.assign(d.settings, saved.settings || {}), hist: saved.hist || {} });
    }
    if (!validSession(S.practice)) S.practice = null;
    if (!validSession(S.exam)) S.exam = null;
    if (!S.practice && (S.screen === 'practice' || S.screen === 'practiceReport')) S.screen = 'home';
    if (!S.exam && (S.screen === 'exam' || S.screen === 'examResults')) S.screen = 'home';
    S.confirm = false;
    render();
    tick();
  }
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
